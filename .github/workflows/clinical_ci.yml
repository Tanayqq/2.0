name: MedRef Clinical Quality CI/CD Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  clinical-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Pytest Regression Suite
        run: pytest backend/tests -v

      - name: Run Phase 3 Clinical Benchmark Harness
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python phase3/evaluation/clinical_eval_suite.py --specialty all

      - name: Run Multi-Dimensional Coverage Analyzer
        run: python phase3/corpus/coverage_analyzer.py

      - name: Execute Full CI/CD Quality Gate
        run: python scripts/ci_quality_gate.py
